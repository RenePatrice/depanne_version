# =============================================================================
# Parema Connect — stack de développement Docker (backend web).
#
# Reproduit `scripts\dev.cmd` : PostgreSQL + PostGIS, l'app web, la file,
# le planificateur et Reverb. L'application mobile Flutter reste native.
#
#   docker compose up -d --build     # tout démarrer (1er run : long)
#   docker compose logs -f app       # suivre l'app
#   docker compose exec app php artisan test
#   docker compose down              # arrêter (les données restent)
#
# Accès : web http://localhost:8000 · Reverb ws://localhost:8080 · PG :5433
# =============================================================================
name: parema

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: depanne_moi
  DB_USERNAME: depanne
  DB_PASSWORD: depanne_local
  DB_SSLMODE: disable
  APP_URL: http://localhost:8000
  REVERB_HOST: localhost
  REVERB_SERVER_HOST: 0.0.0.0

x-app: &app-common
  image: parema-app:latest
  restart: unless-stopped
  environment: *app-env
  volumes:
    - ./backend-laravel:/var/www/html
    # Volumes nommés : les dépendances Linux (vendor, node_modules) ne doivent
    # pas être partagées avec celles de l'hôte Windows (binaires natifs).
    - vendor:/var/www/html/vendor
    - node_modules:/var/www/html/node_modules

services:

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: depanne_moi
      POSTGRES_USER: depanne
      POSTGRES_PASSWORD: depanne_local
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depanne -d depanne_moi"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *app-common
    build:
      context: ./docker/php
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    # NB : pas `artisan serve` — il réinjecte le .env (monté) dans son
    # sous-processus et écraserait DB_HOST=db. On lance le serveur PHP intégré
    # avec le routeur de Laravel, depuis `public/` (le routeur utilise getcwd()).
    command: ["sh", "-c", "cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

  queue:
    <<: *app-common
    command: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=0"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  scheduler:
    <<: *app-common
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  reverb:
    <<: *app-common
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  db-data:
  vendor:
  node_modules:
