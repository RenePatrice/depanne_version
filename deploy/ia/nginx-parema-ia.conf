# Bloc nginx pour un serveur déjà équipé de nginx (variante proxy-existant.yml).
# Remplacer IA_DOMAINE et IA_JETON, activer, puis :
#   sudo certbot --nginx -d IA_DOMAINE --redirect
# certbot ajoute lui-même le HTTPS (port 443) et la redirection depuis le 80.
# IA_DOMAINE peut être une adresse sslip.io : ia.203-0-113-10.sslip.io

server {
    listen 80;
    server_name IA_DOMAINE;
    server_tokens off;

    # Seules /api/chat et /api/tags, et seulement avec le jeton.
    location ~ ^/api/(chat|tags)$ {
        if ($http_authorization != "Bearer IA_JETON") {
            return 401;
        }
        proxy_pass http://127.0.0.1:11434;
        proxy_read_timeout 60s;
        proxy_set_header Host localhost;
    }

    location / {
        return 401;
    }
}
